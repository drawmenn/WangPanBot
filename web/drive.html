<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WangPanBot Drive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/web/drive.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <div class="bg-layer"></div>
    <main class="page">
      <header class="topbar">
        <div>
          <h1>WangPanBot Drive</h1>
          <p>网页端文件检索与管理</p>
        </div>
        <div class="topbar-actions">
          <button
            id="uploadToggle"
            class="icon-btn"
            type="button"
            title="上传文件"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="uploadPanel"
          >
            上传
          </button>
          <button
            id="tokenToggle"
            class="icon-btn"
            type="button"
            title="管理员令牌"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="tokenPanel"
          >
            令牌
          </button>
          <button id="refreshBtn" type="button">刷新</button>

          <div id="uploadPanel" class="popover" role="dialog" aria-label="上传文件" hidden>
            <div class="popover-title">上传文件</div>
            <input id="uploadInput" type="file" />
            <button id="uploadBtn" type="button">开始上传</button>
            <p id="uploadHint" class="help-text">
              上传需要管理员令牌，并且服务端需配置 `WEB_UPLOAD_CHAT_ID` 或 `ADMIN_ID`。
            </p>
          </div>

          <div id="tokenPanel" class="popover" role="dialog" aria-label="管理员删除令牌" hidden>
            <div class="popover-title">管理员删除令牌（可选）</div>
            <input
              id="tokenInput"
              type="password"
              placeholder="WEB_ADMIN_TOKEN"
              autocomplete="off"
            />
            <div class="popover-btns">
              <button id="saveTokenBtn" type="button">保存令牌</button>
              <button id="clearTokenBtn" type="button">清空令牌</button>
            </div>
            <p class="help-text">
              未配置令牌时，本页仍可查看与搜索，但网页删除功能会禁用。
            </p>
          </div>
        </div>
      </header>

      <section class="panel search-panel">
        <form id="searchForm">
          <div class="search-row">
            <input
              id="keywordInput"
              type="text"
              placeholder="输入关键词，例如：教程 / mp4 / 设计文档"
            />
            <select id="typeSelect"></select>
            <select id="sortSelect"></select>
            <select id="limitSelect">
              <option value="20">每页 20</option>
              <option value="50">每页 50</option>
              <option value="100">每页 100</option>
              <option value="custom">自定义</option>
            </select>
            <input
              id="limitInput"
              type="number"
              min="1"
              max="100"
              value="20"
              title="每页条数 (1-100)"
              hidden
            />
            <input id="pageInput" type="number" min="1" value="1" />
            <button type="submit">搜索</button>
          </div>
        </form>
      </section>

      <section class="panel table-panel">
        <div class="table-head">
          <h2>文件列表</h2>
          <p id="statusText">等待查询</p>
        </div>
        <p class="stats-line">
          <span>总文件数 <strong id="totalCount">-</strong></span>
          <span>总容量 <strong id="totalSize">-</strong></span>
          <span>当前页 <strong id="currentPage">-</strong></span>
          <span>筛选 <strong id="filterLabel">-</strong></span>
        </p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>文件名</th>
                <th>大小</th>
                <th>上传时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="fileTableBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prevBtn" type="button">上一页</button>
          <span id="pagerText">第 1 页</span>
          <button id="nextBtn" type="button">下一页</button>
        </div>
      </section>
    </main>

    <script src="/web/drive.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
